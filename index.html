for(const b of boxes){const cx=Math.max(b.min.x,Math.min(p.x,b.max.x)),cy=Math.max(b.min.y,Math.min(p.y,b.max.y)),cz=Math.max(b.min.z,Math.min(p.z,b.max.z)),n=V(p.x-cx,p.y-cy,p.z-cz),l=n.length();

for(const r of rags)for(const q of r.pts){const d=tmpV.subVectors(q.p,p),l=d.length(),rad=pr.r+q.r;if(l<rad&&l>1e-6){d.divideScalar(l);q.p.addScaledVector(d,rad-l);q.o.addScaledVector(v,-dt*.6);q.o.addScaledVector(d,-.002);v.multiplyScalar(.997);r.alive=false}}

/* ---------- raycast ---------- */
function raycast(o,d,max=200){let b={t:max};

for(const x of boxes){let tn=-1e9,tf=1e9,a0='x',s0=1;for(const a of AX){const inv=1/d[a],t1=(x.min[a]-o[a])*inv,t2=(x.max[a]-o[a])*inv,lo=Math.min(t1,t2),hi=Math.max(t1,t2);if(lo>tn){tn=lo;a0=a;s0=t1<t2?-1:1}if(hi<tf)tf=hi}
if(tn<=tf&&tn>0&&tn<b.t){const n=V();n[a0]=s0;b={t:tn,kind:'b',n}}}
for(const pr of props){const oc=tmpV.subVectors(o,pr.pos),bb=oc.dot(d),c=oc.lengthSq()-pr.r*pr.r,disc=bb*bb-c;if(disc>=0){const t=-bb-Math.sqrt(disc);if(t>0&&t<b.t)b={t,kind:'p',pr,n:up}}}

return b}

function blackHole(pos){const g=new THREE.Group(),core=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0})),ring=new THREE.Mesh(new THREE.TorusGeometry(1.4,.12,8,40),new THREE.MeshBasicMaterial({color:0xa855ff,transparent:true,blending:THREE.AdditiveBlending})),halo=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0x6d28d9,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false}));

function clearAll(){rags.forEach(removeRag);rags.length=0;props.forEach(p=>scene.remove(p.m));props.length=0;rockets.forEach(r=>scene.remove(r.m));rockets.length=0;fields.forEach(f=>scene.remove(f.g));fields.length=0;grab=null}
/* ---------- physics step ---------- */
function phys(){simT+=1/60;const g=-20*GM()/3600;let gp=null;
if(grab){const t=eye().addScaledVector(getDir(),grab.dist);if(grab.pr)grab.pr.vel.set(...['x','y','z'].map(a=>Math.max(-30,Math.min(30,(t[a]-grab.pr.pos[a])*14))));else gp=t}
for(const r of rags){for(const q of r.pts){const p=q.p,o=q.o,vx=(p.x-o.x)*.994,vy=(p.y-o.y)*.994,vz=(p.z-o.z)*.994;o.copy(p);p.x+=vx;p.y+=vy+g;p.z+=vz;
for(const f of fields){const d=tmpV.subVectors(f.pos,p),l=d.length();if(l<22&&l>.3){const k=.012+.05*(1-l/22);d.divideScalar(l);o.x-=d.x*k-d.z*k*.4;o.y-=d.y*k;o.z-=d.z*k+d.x*k*.4;r.alive=false}}

for(const k of rockets){const len=k.vel.length()/60,d=k.vel.clone().normalize(),h=raycast(k.pos,d,len+.3);burst(k.pos,2,0xffa040,1,.12,.35,0);burst(k.pos,1,0x777777,.5,.2,.8,-.05);

{const b=new THREE.Mesh(new THREE.BoxGeometry(.08,.1,.45),gunMat),r=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.3,8),gunMat);r.rotation.x=Math.PI/2;r.position.set(0,.02,-.3);gun.add(b,r);gun.position.set(.22,-.2,-.5);cam.add(gun)}
